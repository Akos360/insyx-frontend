server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # nginx's bundled mime.types has no .mjs entry, so it falls back to
  # application/octet-stream — browsers refuse to run a module Worker
  # (maplibre-gl's tile-processing worker) served with that MIME type.
  location ~* \.mjs$ {
    default_type application/javascript;
  }

  # Vite fingerprints every filename under /assets/ with a content hash, so a
  # code change always produces a new URL — safe to cache these forever.
  # index.html (served below) is deliberately NOT covered by this block: it's
  # the one file that must always be re-fetched, since it's what references
  # the current hashed asset filenames.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
