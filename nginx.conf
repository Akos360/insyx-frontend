server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # nginx's bundled mime.types has no .mjs entry, so it falls back to
  # application/octet-stream — browsers refuse to run a module Worker
  # (maplibre-gl's tile-processing worker) served with that MIME type.
  location ~* \.mjs$ {
    default_type application/javascript;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
